[package]
name = "abelian"
version = "0.1.0"
edition = "2024"
description = "A version control substrate in which states are sums, patches commute, and history is arithmetic."
license = "Apache-2.0"

[lib]
name = "abelian"

[[bin]]
name = "tally"
path = "src/main.rs"

[dependencies]
arrrg = "0.10.0"
arrrg_derive = "0.10.0"
getopts = "0.2.24"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
setsum = "0.9.0"
sha3 = "0.10.9"
zstd = "0.13.3"
