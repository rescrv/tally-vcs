[package]
name = "abelian"
version = "0.1.0"
edition = "2024"
description = "A version control substrate in which states are sums, patches commute, and history is arithmetic."
license = "Apache-2.0"

[features]
# The pi coding-agent integration (the abelian-pi-editor binary).
pi = []

[lib]
name = "abelian"

[[bin]]
name = "abelian"
path = "src/bin/abelian.rs"

# Purpose-built hook pi's text editor calls (see pi/abelian-editor.ts).
[[bin]]
name = "abelian-pi-editor"
path = "src/bin/pi-editor.rs"
required-features = ["pi"]

[dependencies]
arrrg = "0.10.0"
arrrg_derive = "0.10.0"
chrono = "0.4"
futures-executor = "0.3"
getopts = "0.2.24"
handled = "0.9.0"
object_store = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
setsum = "0.9.0"
sha3 = "0.10.9"
zstd = "0.13.3"
